name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.100
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  MSBUILDDISABLENODEREUSE: "1"
  BUILD_CONFIGURATION: Release
  PROJECT_KEY: CaptionGen

jobs:
  quality:
    name: Build, test, coverage, Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        shell: bash
        run: |
          PROJECT_KEY="${SONAR_PROJECT_KEY:-${PROJECT_KEY}}"
          dotnet sonarscanner begin \
            /k:"${PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /n:"CaptionGen" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="ai-service/coverage.xml" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/*.Designer.cs,**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/TestResults/**,src/CaptionGen.Frontend/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,src/frontend/**,src/CaptionGen.Frontend/**"

      - name: Restore .NET
        run: dotnet restore CaptionGen.sln

      - name: Build .NET
        run: dotnet build CaptionGen.sln --no-restore -c ${{ env.BUILD_CONFIGURATION }} -m:1 /nr:false /p:UseSharedCompilation=false

      - name: Unit tests with coverage
        run: >
          dotnet test src/CaptionGen.Tests.Unit/CaptionGen.Tests.Unit.csproj
          --no-build
          -c ${{ env.BUILD_CONFIGURATION }}
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit
          --logger "trx;LogFileName=unit.trx"

      - name: Integration tests with coverage
        run: >
          dotnet test src/CaptionGen.Tests.Integration/CaptionGen.Tests.Integration.csproj
          --no-build
          -c ${{ env.BUILD_CONFIGURATION }}
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration
          --logger "trx;LogFileName=integration.trx"

      - name: Python dependencies
        working-directory: ai-service
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Python tests with coverage
        working-directory: ai-service
        run: pytest --cov=. --cov-config=setup.cfg --cov-report=xml:coverage.xml --cov-report=term-missing -q

      - name: React frontend build
        working-directory: src/frontend
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build

      - name: Sonar end
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

  docker-and-deploy:
    name: Build images and deploy Azure
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group and ACR
        shell: bash
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az group create \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --location "${{ secrets.AZURE_LOCATION }}"
          az acr show \
            --name "${{ secrets.AZURE_ACR_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            >/dev/null 2>&1 || \
          az acr create \
            --name "${{ secrets.AZURE_ACR_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --location "${{ secrets.AZURE_LOCATION }}" \
            --sku Basic \
            --admin-enabled false

      - name: ACR login
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Resolve ACR login server
        id: acr
        run: echo "login_server=$(az acr show --name '${{ secrets.AZURE_ACR_NAME }}' --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CaptionGen.Api/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/captiongen-api:${{ github.sha }}

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: ai-service/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/captiongen-ai:${{ github.sha }}

      - name: Build and push React frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/frontend/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/captiongen-frontend:${{ github.sha }}
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy Azure Container Apps
        shell: bash
        env:
          STRIPE_SECRET_KEY_VALUE: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_VALUE: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY_VALUE: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_BASIC_PRICE_ID: ${{ vars.STRIPE_BASIC_PRICE_ID }}
          STRIPE_FREELANCER_PRICE_ID: ${{ vars.STRIPE_FREELANCER_PRICE_ID }}
          STRIPE_INFLUENCER_PRICE_ID: ${{ vars.STRIPE_INFLUENCER_PRICE_ID }}
          STRIPE_AGENCY_PRICE_ID: ${{ vars.STRIPE_AGENCY_PRICE_ID }}
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters \
            projectName="${{ secrets.AZURE_PROJECT_NAME }}" \
            location="${{ secrets.AZURE_LOCATION }}" \
            containerRegistryName="${{ secrets.AZURE_ACR_NAME }}" \
            apiImage="captiongen-api:${{ github.sha }}" \
            aiImage="captiongen-ai:${{ github.sha }}" \
            frontendImage="captiongen-frontend:${{ github.sha }}" \
            postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            jwtKey="${{ secrets.JWT_KEY }}" \
            openAiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            stripeSecretKey="${STRIPE_SECRET_KEY_VALUE:-}" \
            stripeWebhookSecret="${STRIPE_WEBHOOK_SECRET_VALUE:-}" \
            stripePublishableKey="${STRIPE_PUBLISHABLE_KEY_VALUE:-}" \
            stripeBasicPriceId="${STRIPE_BASIC_PRICE_ID:-}" \
            stripeFreelancerPriceId="${STRIPE_FREELANCER_PRICE_ID:-}" \
            stripeInfluencerPriceId="${STRIPE_INFLUENCER_PRICE_ID:-}" \
            stripeAgencyPriceId="${STRIPE_AGENCY_PRICE_ID:-}"
