services:
  db:
    image: postgres:16-alpine
    container_name: captiongen-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: captiongen
    ports:
      - "5432:5432"
    volumes:
      - captiongen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d captiongen"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    image: captiongen-ai:local
    container_name: captiongen-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: src/CaptionGen.Api/Dockerfile
    image: captiongen-api:local
    container_name: captiongen-api
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=db;Port=5432;Database=captiongen;Username=app;Password=app
      AiService__BaseUrl: http://ai:8001
      AiService__HealthPath: health
      Database__AutoMigrate: "true"
      Seed__Enabled: "true"
      MediaStorage__Provider: Local
      MediaStorage__RootPath: /app/media
      MediaStorage__PublicBaseUrl: ${API_PUBLIC_BASE_URL:-http://localhost:5080/media}
      Jwt__Issuer: CaptionGen
      Jwt__Audience: CaptionGen
      Jwt__Key: CHANGE_ME_32CHARS_MINIMUM_CHANGE_ME_NOW
      Jwt__AccessMinutes: "60"
      Jwt__CookieName: cg_at
      Jwt__AllowInsecureCookieOnHttp: "true"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - captiongen_media:/app/media

  frontend:
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    image: captiongen-frontend:local
    container_name: captiongen-frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8080:8080"

  sonarqube:
    image: sonarqube:community
    container_name: captiongen-sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonarqube-db:
    image: postgres:16-alpine
    container_name: captiongen-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data

volumes:
  captiongen_pgdata:
  captiongen_media:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_pgdata:
