services:
  db:
    image: postgres:16
    container_name: captiongen-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: captiongen
    ports:
      - "5432:5432"
    volumes:
      - captiongen_pgdata:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: captiongen-sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonarqube-db:
    image: postgres:16
    container_name: captiongen-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data

volumes:
  captiongen_pgdata:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_pgdata: